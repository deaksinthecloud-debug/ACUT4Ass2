name: ci

# When to run: on every push, and on every pull request
on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest          # a fresh Linux machine provided by GitHub

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip                # reuse downloaded packages between runs (faster)

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate the raw data
        run: python -m src.validate

